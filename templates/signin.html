<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign In - ZeroTrace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <nav class="navbar">
        <div class="nav-inner">
            <a href="/" class="nav-logo">Zero<span>Trace</span></a>
            <div class="nav-links">
                <a href="/signup" class="btn-ghost">Sign Up</a>
            </div>
        </div>
    </nav>
    <main class="auth-page">
        <div class="auth-card">
            <div class="auth-header">
                <h1>Welcome back</h1>
                <p>Sign in to your account</p>
            </div>
            <form id="signin-form">
                <div class="form-group">
                    <label for="si-username">Username</label>
                    <input id="si-username" type="text" placeholder="johndoe" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="si-password">Password</label>
                    <input id="si-password" type="password" placeholder="Your password" autocomplete="current-password" required>
                </div>
                <div id="si-error" class="auth-error" style="display:none;"></div>
                <button type="submit" class="btn-primary btn-lg btn-full" id="si-submit">Sign In</button>
            </form>
            <p class="auth-switch">Don't have an account? <a href="/signup">Sign up</a></p>
        </div>
    </main>
    <script>
    (() => {
        const form = document.getElementById("signin-form");
        const errorEl = document.getElementById("si-error");
        const submitBtn = document.getElementById("si-submit");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            errorEl.style.display = "none";
            const username = document.getElementById("si-username").value.trim();
            const password = document.getElementById("si-password").value.trim();

            submitBtn.disabled = true;
            submitBtn.textContent = "Signing in...";

            try {
                const res = await fetch("/api/signin", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = "/app";
                } else {
                    errorEl.textContent = data.message;
                    errorEl.style.display = "block";
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Sign In";
                }
            } catch {
                errorEl.textContent = "Network error. Try again.";
                errorEl.style.display = "block";
                submitBtn.disabled = false;
                submitBtn.textContent = "Sign In";
            }
        });
    })();
    </script>
</body>
</html>
