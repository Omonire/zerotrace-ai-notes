<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trash - ZeroTrace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-bg text-gray-100 font-sans min-h-screen">

    <nav class="sticky top-0 z-50 backdrop-blur-xl bg-bg/80 border-b border-border">
        <div class="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="/" class="text-xl font-extrabold tracking-tight">Zero<span class="text-accent">Trace</span></a>
            <div class="flex items-center gap-3">
                <a href="/app" class="text-sm text-gray-400 hover:text-white transition-colors px-3 py-2 rounded-lg hover:bg-white/5">Notes</a>
                <a href="/logout" class="text-sm text-gray-400 hover:text-white transition-colors px-3 py-2 rounded-lg hover:bg-white/5">Sign Out</a>
            </div>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 py-10">
        <div class="flex items-center justify-between mb-8">
            <div>
                <h1 class="text-2xl font-extrabold">Trash</h1>
                <p class="text-sm text-gray-500 mt-1">Notes in trash are deleted after 30 days</p>
            </div>
            <div class="flex gap-3">
                <button id="empty-trash-btn" class="bg-red-500/10 hover:bg-red-500/20 text-red-400 font-semibold text-sm px-5 py-2.5 rounded-xl transition-all border border-red-500/20">
                    Empty Trash
                </button>
            </div>
        </div>

        <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3" id="trash-grid">
            {% if notes %}
                {% for note in notes %}
                    <article class="bg-surface border border-border rounded-2xl p-5 group" data-id="{{ note['id'] }}">
                        <div class="mb-4">
                            <h3 class="font-bold mb-2 text-gray-300">{{ note['title'] }}</h3>
                            <p class="text-sm text-gray-500 leading-relaxed line-clamp-3">{{ note['content'][:200] }}</p>
                        </div>
                        <div class="flex items-center justify-between pt-3 border-t border-border">
                            <time class="text-xs text-gray-600">Deleted {{ note['deleted_at'] }}</time>
                            <div class="flex items-center gap-1">
                                <button class="restore-btn text-xs text-gray-400 hover:text-accent px-3 py-1.5 rounded-lg hover:bg-white/5 transition-colors" data-id="{{ note['id'] }}">Restore</button>
                                <button class="permanent-btn text-xs text-gray-400 hover:text-red-400 px-3 py-1.5 rounded-lg hover:bg-white/5 transition-colors" data-id="{{ note['id'] }}">Delete</button>
                            </div>
                        </div>
                    </article>
                {% endfor %}
            {% endif %}
        </div>

        <div id="empty-trash" class="text-center py-20 {{ 'hidden' if notes else '' }}">
            <svg class="w-12 h-12 text-gray-600 mx-auto mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"/></svg>
            <h3 class="font-bold text-gray-300 mb-1">Trash is empty</h3>
            <p class="text-sm text-gray-500">Deleted notes will appear here.</p>
        </div>
    </main>

    <div id="toast-container" class="fixed bottom-6 right-6 z-50 flex flex-col gap-2"></div>

    <script>
    (() => {
        const toastContainer = document.getElementById("toast-container");
        const trashGrid = document.getElementById("trash-grid");
        const emptyTrash = document.getElementById("empty-trash");

        function showToast(msg, type = "success") {
            const t = document.createElement("div");
            t.className = `px-4 py-3 rounded-xl text-sm font-medium shadow-lg ${type === "error" ? "bg-red-500/90 text-white" : "bg-green-500/90 text-white"} backdrop-blur-sm`;
            t.textContent = msg;
            toastContainer.appendChild(t);
            setTimeout(() => { t.style.transition = "opacity 0.3s"; t.style.opacity = "0"; setTimeout(() => t.remove(), 300); }, 3000);
        }

        trashGrid.addEventListener("click", async (e) => {
            const restore = e.target.closest(".restore-btn");
            const permanent = e.target.closest(".permanent-btn");

            if (restore) {
                const id = restore.dataset.id;
                try {
                    const res = await fetch(`/api/notes/${id}/restore`, { method: "PUT" });
                    const data = await res.json();
                    if (data.success) {
                        restore.closest("article").remove();
                        showToast("Note restored");
                        if (!trashGrid.children.length) emptyTrash.classList.remove("hidden");
                    }
                } catch { showToast("Failed", "error"); }
            }

            if (permanent) {
                const id = permanent.dataset.id;
                if (!confirm("Permanently delete this note?")) return;
                try {
                    const res = await fetch(`/api/notes/${id}/permanent`, { method: "DELETE" });
                    const data = await res.json();
                    if (data.success) {
                        permanent.closest("article").remove();
                        showToast("Note deleted permanently");
                        if (!trashGrid.children.length) emptyTrash.classList.remove("hidden");
                    }
                } catch { showToast("Failed", "error"); }
            }
        });

        document.getElementById("empty-trash-btn").addEventListener("click", async () => {
            if (!confirm("Permanently delete ALL notes in trash?")) return;
            try {
                const res = await fetch("/api/trash/empty", { method: "DELETE" });
                const data = await res.json();
                if (data.success) {
                    trashGrid.innerHTML = "";
                    emptyTrash.classList.remove("hidden");
                    showToast(data.message);
                }
            } catch { showToast("Failed", "error"); }
        });
    })();
    </script>
</body>
</html>
